<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Title & SEO Meta Tags -->
    <title>Encegen AI — Enterprise Process Intelligence &amp; Autonomous Execution Platform</title>
    <meta name="title" content="Encegen AI — Enterprise Process Intelligence &amp; Autonomous Execution Platform" />
    <meta
      name="description"
      content="Encegen is the leading AI-native process intelligence and autonomous execution platform. Discover bottlenecks, optimize workflows, and orchestrate intelligent multi-agent automation across your enterprise systems."
    />
    <meta
      name="keywords"
      content="Encegen, Encegen AI, Process Intelligence, Enterprise AI, Autonomous Workflows, Process Mining, AI Agent Networks, Execution Management System, Workflow Automation, ERP Intelligence"
    />
    <meta name="author" content="Encegen AI Labs Pvt. Ltd." />
    <meta name="application-name" content="Encegen" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#090d16" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Encegen AI" />
    <meta property="og:url" content="https://www.encegen.com/" />
    <meta property="og:title" content="Encegen AI — Enterprise Process Intelligence &amp; Autonomous Execution Platform" />
    <meta
      property="og:description"
      content="Transform enterprise operations with Encegen. Real-time process mining, predictive analytics, and autonomous AI agents designed for high-scale workflows."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:alt" content="Encegen AI Logo" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@encegen" />
    <meta name="twitter:creator" content="@encegen" />
    <meta name="twitter:title" content="Encegen AI — Enterprise Process Intelligence &amp; Autonomous Execution Platform" />
    <meta
      name="twitter:description"
      content="Transform enterprise operations with Encegen. Real-time process mining, predictive analytics, and autonomous AI agents."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data / JSON-LD for Google Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Encegen AI Labs",
        "alternateName": "Encegen",
        "url": "https://www.encegen.com",
        "logo": "https://www.encegen.com/logo.png",
        "description": "Enterprise Process Intelligence and Autonomous Execution Platform",
        "sameAs": [
          "https://www.linkedin.com/company/encegen",
          "https://twitter.com/encegen"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "contact@encegen.com"
        }
      }
    </script>
    <!-- Prevent Google Translate Top Banner and Tooltips -->
    <style>
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      .VIpgJd-ZVi9od-ORHb-OEVmfc,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc,
      .VIpgJd-ZVi9od-vH1Gmf,
      #goog-gt-tt,
      #goog-gt-vt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
      }
      body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
      }
      body > .skiptranslate {
        display: none !important;
      }
      html {
        top: 0px !important;
      }
      .hidden-gt-element {
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        opacity: 0 !important;
        pointer-events: none !important;
        z-index: -999 !important;
      }
    </style>
  </head>
  <body>
    <div id="google_translate_element" class="hidden-gt-element"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new window.google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,fr,de,es,it',
            autoDisplay: false
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
